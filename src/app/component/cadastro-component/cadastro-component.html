<div id="div-form">
    <h2>Cadastro</h2>

    <form id="form-cadastro" (ngSubmit)="enviaDadosPessoa()">

        <label for="nome">Nome</label>
        <input type="text" name="nome" id="nome" class="input01" [(ngModel)] = "nome"  placeholder="Informe o nome do cliente">

        <label for="cpf">CPF</label>
        <input type="text" name="cpf" id="cpf" class="input01" [(ngModel)] = "cpf" required maxlength="11" placeholder="Informe o CPF do cliente">

        <label for="nascimento">Data de Nascimento</label>
        <input type="date" name="data_nascimento" id="data_nascimento" class="input01" [(ngModel)] = "data_nascimento" placeholder="Informe a data de nascimento do cliente">

        <label for="sexo">Sexo</label>
        <select name = "sexo" id="sexo" class="input01" [(ngModel)] = "sexo" placeholdder = "Selecione o sexo">
        <option value="masculino">Masculino</option>
        <option value="feminino">Feminino</option>
        </select>
        

        <label for="email">Email</label>
        <input type="text" name="email" id="email" class="input01" [(ngModel)] = "email" placeholder="Informe o email do cliente">

        <label for="telefone">Telefone</label>
        <input type="number" name="telefone" id="telefone" class="input01" [(ngModel)] = "telefone" placeholder="Informe o telefone do cliente">
        

        <button type="submit">{{ editar ? 'Salvar alterações' : 'Salvar' }}</button>
        <button type="button" class="btn-voltar" (click)="voltarParaLista()">Ir para Clientes</button>

    </form>
</div>
